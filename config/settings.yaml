# ── LLM Provider ──────────────────────────────────────────────────────
# provider: which backend to use for all LLM calls
#   claude_cli     — claude --print subprocess (default, no API key)
#   anthropic_api  — Anthropic Python SDK (needs ANTHROPIC_API_KEY in .env)
#   openai_api     — OpenAI-compatible (needs OPENAI_API_KEY; set OPENAI_BASE_URL for Groq/Together/etc.)
#   ollama         — Local models via Ollama (needs ollama serve running)
# Switch at runtime with: /provider <name>
provider: claude_cli

# provider_model: the specific model name to use with the active provider
# For claude_cli: haiku / sonnet / opus
# For openai_api: gpt-4o / gpt-4o-mini / etc.
# For ollama: llama3.1 / mistral / codellama / etc.
# For anthropic_api: haiku / sonnet / opus (mapped to full model IDs)
model: sonnet            # alias: haiku / sonnet / opus
routing_model: haiku     # model used for Aria's routing decision — haiku is faster and sufficient
safe_context_tokens: 200000  # token threshold for the context bar (sonnet/opus = 200k, haiku = 200k)
max_history_messages: 10 # conversation turns loaded when resuming a project
max_memory_entries: 15   # max memory entries injected into agent prompts (full history kept on disk)
max_routing_memory: 8    # memory entries passed to routing (smaller = faster routing calls)
max_project_docs: 1      # docs injected into agent prompts (most recent only; full docs on disk)
max_doc_chars: 900       # chars per injected doc (truncated; say 'show full <doc>.md' for complete)
max_read_file_chars: 20000  # chars read per READ_FILE request; review/audit tasks always get full file

team:
  default_roster:
    - pm
    - bsa
    - developer
    - lead
  available_agents:
    - researcher
    - qa
    - devops

